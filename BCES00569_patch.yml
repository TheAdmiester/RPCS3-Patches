Version: 1.2

PPU-7a5ee7bc2fef9566dd80e35893fe2c5571197726:
  "Chase Camera - CAR5 FOV and Pitch":
    Games:
      "Gran Turismo 5":
        BCES00569: [02.11]
    Author: "TheAdmiester"
    Patch Version: 1.0
    Group: ""
    Notes: "Makes the chase view (camera 1) respect the assigned FOV and pitch of its CAR5 camera entry. By default this will likely not have much visible effect - this opens up the opportunity to set per-car cameras in their own info files."

    Patch:
      # Force chase cam to read FOV from CAR5 data each frame
      - [be32, 0x004870F0, 0x38C00025] # li r6, 0x25 (was li r6, 5)

      # NOP the instruction that wrote 0 to chase pitch every frame
      - [be32, 0x00486060, 0x60000000] # nop (was stw r0, 0(r28))

  "Read Car Camera Data From USRDIR":
    Games:
      "Gran Turismo 5":
        BCES00569: [02.11]
    Author: "TheAdmiester"
    Patch Version: 1.0
    Group: ""
    Notes: "Loads every CAR5 file from /USRDIR/car/info/<id>. Complements CAR5 FOV and Pitch patch as this means the cars' camera data can be edited at runtime (e.g. load into race, check cam, change values, reload race). All car/info files MUST be extracted to USRDIR/car/info as there is no fallback to the original files."

    Patch:
      - [utf8, 0x01948F00, "/APP_DATA_RAW/car/info/%s"] # Rewrite car/info string into free memory
      - [be32, 0x002D29B0, 0x3D200195]   # Repoint path use to new string (upper)
      - [be32, 0x002D29B4, 0x39298F00]   # Ditto (lower)

  "Enable Motion Blur in Gameplay":
    Games:
      "Gran Turismo 5":
        BCES00569: [02.11]
    Author: "TheAdmiester"
    Patch Version: 1.0
    Group: "Motion Blur"
    Notes: "Enables replay motion blur in gameplay modes with a couple of fixes to stop it breaking mirrors."

    Configurable Values:
      "Shutter Rate":
        Type: double_range
        Value: 0.6
        Min: 0.0
        Max: 2.0

    Patch:
      # Force replay motion blur in gameplay scene mode
      - [be32, 0x0045B534, 0x38A00001]

      # User-definable shutter rate aka motion blur length
      - [bef32, 0x01456DD4, "Shutter Rate"]

      # Skip applying to mirrors' cameras
      - [be32, 0x008A9418, 0x81240000] # lwz  r9, 0(r4) (was mr r3, r4)
      - [be32, 0x008A943C, 0x83290000] # lwz  r25, 0(r9) (was bl sub_2568B0)
      - [be32, 0x008A9440, 0x83490008] # lwz  r26, 8(r9)  (was mr r25, r3)
      - [be32, 0x008A9444, 0x80090084] # lwz  r0, 0x84(r9) (was mr r3, r27)
      - [be32, 0x008A9448, 0x2F9A0000] # cmpwi cr7, r26, 0 (was bl sub_3E3BBC)
      - [be32, 0x008A944C, 0x2B000002] # cmplwi cr6, r0, 2 (was cmpwi cr7, r3, 0)
      - [be32, 0x008A9450, 0x4FDECB82] # cror cr7.eq, cr7.eq, cr6.gt (was mr r26, r3)
      - [be32, 0x008A95F0, 0x81240000] # lwz  r9, 0(r4) (was mr r3, r4)
      - [be32, 0x008A9610, 0x83E90008] # lwz  r31, 8(r9) (was bl sub_3E3BBC)
      - [be32, 0x008A9614, 0x80090084] # lwz  r0, 0x84(r9)(was mr r31, r3)
      - [be32, 0x008A9618, 0x2B000002] # cmplwi cr6, r0, 2 (was mr r3, r29)
      - [be32, 0x008A9624, 0x4199003C] # bgt  cr6, loc_8A9660 (was bl sub_2568B0)
      - [be32, 0x008A9630, 0x83490000] # lwz  r26, 0(r9) (was mr r26, r3)
      # Upgrade the motion blur shader so that it works based on depth so that mirrors are skipped (different to disabling it on mirror cameras, this prevents the blur from "bleeding in" to the mirrors)
      # Shader bytecode section was LLM-assisted as admittedly shaders are a total black box to me
